# 临时音频托管（ASR 专用）—— nginx 配置片段

> 挂载位置：`nexus.kotete.xyz` 的 **HTTPS** server 块（443），
> 即含 `ssl_certificate /etc/nginx/ssl/nexus.kotete.xyz.crt;` 的那个块。
> 不要挂到 HTTP 跳转块（那个块只有 `return 301`，挂了也不生效）。
>
> 生效步骤：
> ```bash
> mkdir -p /var/www/asrtmp && chmod 755 /var/www/asrtmp
> nginx -t && systemctl reload nginx
> ```

## 为什么需要这段配置

阿里云 Paraformer（录音文件识别）**只接受公网可访问的 HTTP/HTTPS URL**，
官方原文：「不支持 Base64 编码或本地文件路径」。

而抖音视频下载下来是本地文件 —— 所以必须有个地方把音频临时暴露到公网，
让 DashScope 能拉到。这就是 `/asrtmp/` 存在的唯一理由。

## 安全边界（这段配置的每一行都是为它服务的）

| 措施 | 实现 |
|---|---|
| 文件名不可猜测 | pipeline 用 `secrets.token_urlsafe(24)` 生成 |
| 不留存 | 转写完成（无论成败）在 `finally` 里立即 `unlink` |
| 只读 | `limit_except GET HEAD { deny all; }` |
| 不给目录列表 | `autoindex off` |
| 只允许音频格式 | 正则白名单，非音频扩展名落到 403 兜底 |
| 不走 CDN 缓存 | `Cache-Control: no-store` |

## 配置本体

```nginx
# === 临时音频托管（ASR 专用）===
location ~ ^/asrtmp/([A-Za-z0-9_-]+)\.(m4a|wav|mp3|aac|flac|ogg|opus|webm|mp4)$ {
    alias /var/www/asrtmp/$1.$2;
    autoindex off;
    add_header Cache-Control "no-store";
    limit_except GET HEAD { deny all; }
}
location /asrtmp/ {
    return 403;
}
```

## ⚠️ 两个反直觉的坑（我实际踩了，写下来免得再踩）

### 坑 1：不要把正则 location **嵌**在 `location /asrtmp/` 里

**错法**：
```nginx
location /asrtmp/ {
    alias /var/www/asrtmp/;
    location ~* \.(m4a|wav)$ { alias /var/www/asrtmp/; }   # ← 这样写
    location ~ ^/asrtmp/ { return 403; }
}
```

**症状**：请求 `/asrtmp/x.m4a` 返回 **301**，Location 指向 `/asrtmp/x.m4a/`
—— nginx 把它当目录了，文件永远取不到。

**原因**：嵌套正则在 `alias` 场景下语义混乱（`alias` 的路径拼接依赖匹配的
location 前缀，嵌套后基准变了）。扁平写反而确定。

### 坑 2：兜底那条**不能**用 `^~`

**错法**：
```nginx
location ^~ /asrtmp/ { return 403; }    # ← ^~ 会让白名单永远不生效
```

**症状**：**合法音频也返回 403**，整条链路直接断掉。

**原因**：`^~` 是「前缀匹配成功就**直接采纳**、跳过所有正则求值」。
结果上面那条白名单正则从来没机会运行，一切都被兜底 403 吃掉。

**正确做法**：兜底用**普通前缀** `location /asrtmp/`，
靠 nginx 的规则「正则 location 优先于普通前缀 location」来决定优先级。

## 实测用例（2026-09-26，改完后真跑过）

| 请求 | 期望 | 实际 |
|---|---|---|
| `/asrtmp/x.m4a` | 200 | ✅ 200（内容正确） |
| `/asrtmp/x.txt` | 403 | ✅ 403 |
| `/asrtmp/x.m4a/` | 403 | ✅ 403 |
| `/asrtmp/` | 403 | ✅ 403 |
| `/asrtmp/nope.m4a` | 404 | ✅ 404 |
| `/asrtmp/%2e%2e%2fsecret.txt` | 4xx | ✅ 404 |
| POST `/asrtmp/x.m4a` | 403 | ✅ 403 |
| PUT `/asrtmp/x.m4a` | 403 | ✅ 403 |
