name: CI

# 这个项目刻意没有构建步骤（git pull 即部署）。
# CI 也只做「跑测例 + 语法检查」，不引入任何需要构建的东西。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22（node:sqlite 需要 22+）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --- 后端语法检查（不需要装依赖）---
      - name: 后端语法检查
        run: node --check server/server.js

      # --- 两套测例都从 index.html 抽真实代码跑 ---
      - name: 导入校验测例（88 项）
        run: node tests/import-validation.test.js

      - name: 象棋界面测例（22 项）
        run: node tests/chess-ui.test.js

      # 课表周次切换 / 全学期总览：重点防「同屏两个数字口径不一致」
      - name: 课表周次与总览测例（56 项）
        run: node tests/course-week.test.js

      - name: 象棋走法校验器测例
        run: node tests/xiangqi-moves.test.js

      - name: AI 报告（周/月）范围与转义测例
        run: node tests/ai-report.test.js

      # --- 后端冒烟：真起服务，验 gzip / ETag / 鉴权 ---
      - name: 安装后端依赖
        run: cd server && npm ci

      - name: 后端冒烟测试
        run: AUTH_TOKEN=ci-test-token PORT=3999 bash tests/smoke-server.sh

      # --- 月报页冒烟：验 /report 路由 / gzip / ETag / 路径穿越 ---
      - name: 月报路由冒烟测试
        run: AUTH_TOKEN=ci-test-token PORT=3998 bash tests/smoke-report.sh

      # --- 安全加固回归：错误不泄漏堆栈 / KV 同毫秒不丢写 / 报告预压缩 ---
      - name: 安全加固回归测试
        run: AUTH_TOKEN=ci-test-token PORT=3997 bash tests/smoke-hardening.sh

      # --- 手机端体验审计：根字号 / 字号令牌 / title / viewport ---
      - name: 手机端体验审计
        run: node tests/mobile-audit.js

      # --- pm2 配置不变量：换机器能不能把服务起回来，全靠这个文件 ---
      - name: pm2 配置测试
        run: node tests/ecosystem-config.test.js

      # --- 六项安全修复的防回归：被改回去就立刻红 ---
      - name: 安全防回归测试
        run: node tests/security-regression.test.js
